# The URL the site will be built for
base_url = "https://elucas.github.io/risinghurst/"

output_dir = "docs"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true
default_language = "en"
theme = "apollo"

taxonomies = [
    {name = "years", feed = true}, # Poster Records: year it was on an Original Poster
    {name = "months", feed = true}, # Poster Records: month it was on an Original Poster
    {name = "kingdom", feed = true},
    {name = "categories", feed = true},
    {name = "pdfs", feed = true},
    {name = 'senses', feed = true}, # Fragments: see/hear/touch/taste/smell
    {name = "when", feed = true}, # Fragments: time of day only - day / night / dawn / dusk
    {name = "season", feed = true}, # Fragments: months you might expect to encounter it ("November")
]
taxonomy_root = "tags"

generate_sitemap = true

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"




[extra]
# Put all your custom variables here

theme = "auto"
socials = []
# menu = []
#'species'
menu = [
    { name = "Home", url = "/", weight = 0 },
    { name = "(New) Posters", url = "/posters", weight = 1 },
    { name = "Species", url = "/species", weight = 2 },
    # { name = "Months", url = "/tags/months", weight = 2 },
    { name = "Observations", url = "/observations", weight = 3 },
    { name = "Tags", url = "/tags", weight = 4 },
    # { name = "/projects", url = "/projects", weight = 2 },
    { name = "About", url = "/about", weight = 5 },
]

stylesheets = ["risinghurst.css", "sortable-theme-minimal.css"]


[extra.analytics]
enabled = false
